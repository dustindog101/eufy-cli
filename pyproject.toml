[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eufy-local-cli"
version = "0.1.1"
description = "Local Eufy motion control with private standalone configuration"
requires-python = ">=3.11"
dependencies = []
license = "MIT"

[project.scripts]
eufy = "eufy_cli.cli:main"

[tool.setuptools]
packages = ["eufy_cli"]
